# push마다 원본 대조와 빌드가 되는지 확인한다.
#
# 배포는 하지 않는다. 사이트는 Vercel이 만든다(2026-08-09부터). 배포 경로를
# 둘로 두면 어느 쪽이 지금 화면인지 알 수 없게 된다.
#
# 여기서 검증이 깨지면 Vercel 빌드도 같은 자리에서 깨진다. vercel.json의
# buildCommand가 같은 명령을 먼저 돌리기 때문이다.

name: 검증

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 원본 대조 검증
        run: node scripts/verify-migration.mjs

      - name: 빌드
        run: node build.mjs

      - name: 산출물에 시크릿이 섞이지 않았는지 확인
        run: |
          if grep -rlE 'ghp_|github_pat_|ServiceKey=[A-Za-z0-9]' public/; then
            echo '산출물에 키로 보이는 문자열이 있습니다.'
            exit 1
          fi
          echo '시크릿 문자열 0건.'
