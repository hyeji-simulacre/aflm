<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기록 넣고 고치기 — AFLM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
/* 입력 도구에만 쓰는 규칙. 휴대폰 화면을 먼저 맞춘다. */
.admin { max-width: 640px; margin: 0 auto; padding: 32px var(--pad) 120px; }
.admin h1 { font-weight: 500; font-size: 28px; letter-spacing: -.02em; margin: 0 0 4px; }
.admin .sub { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--grey3); margin: 0 0 24px; }

.modes { display: flex; margin-bottom: 26px; border: 1px solid var(--ink); }
.modes button {
  flex: 1; width: auto; border: 0; background: transparent; color: var(--ink);
  padding: 12px 10px; font-size: 13px;
}
.modes button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.field { margin-bottom: 22px; }
.field > label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--grey3); margin-bottom: 8px; }

input[type=text], input[type=password], textarea, select {
  width: 100%; font: inherit; font-size: 16px; /* 16px 미만이면 iOS가 확대한다 */
  color: var(--ink); background: #fff;
  border: 1px solid var(--grey1); border-radius: 0;
  padding: 13px 14px; appearance: none;
}
textarea { font-size: 19px; line-height: 1.45; min-height: 116px; resize: vertical; }
textarea.short { font-size: 16px; min-height: 72px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--forest); outline-offset: -1px; border-color: transparent; }

button {
  font: inherit; font-size: 14px; letter-spacing: .06em;
  padding: 14px 20px; border: 1px solid var(--ink); background: var(--ink); color: #fff;
  border-radius: 0; cursor: pointer; width: 100%;
}
button.ghost { background: transparent; color: var(--ink); }
button[disabled] { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; }
.row button { width: auto; flex: 1; }
.row input { flex: 1; }

.results { list-style: none; margin: 14px 0 0; padding: 0; }
.results li { border-top: 1px solid var(--grey1); }
.results button {
  display: flex; gap: 14px; align-items: flex-start; text-align: left;
  width: 100%; background: transparent; color: inherit; border: 0;
  padding: 14px 0; letter-spacing: 0;
}
.results img, .results .noimg {
  width: 46px; height: 69px; object-fit: cover; flex: none;
  border: 1px solid var(--grey1); background: #fff;
}
.results .noimg { display: grid; place-items: center; font-size: 9px; color: var(--grey3); }
.results .t { font-size: 15px; line-height: 1.35; }
.results .d { font-size: 11px; color: var(--grey3); margin-top: 5px; letter-spacing: .04em; }
.results .src { color: var(--forest); }
.results .gap { color: #8C3328; }

.chosen { border: 1px solid var(--grey1); padding: 16px; display: flex; gap: 14px; background: #fff; }
.chosen img, .chosen .noimg { width: 62px; height: 93px; object-fit: cover; flex: none; border: 1px solid var(--grey1); }
.chosen .noimg { display: grid; place-items: center; font-size: 9px; color: var(--grey3); }
.chosen dl { margin: 0; font-size: 12px; line-height: 1.75; }
.chosen dt { display: none; }
.chosen dd { margin: 0; }
.chosen .name { font-size: 15px; margin-bottom: 4px; }
.chosen .unknown { color: var(--grey3); font-style: italic; }

.msg { padding: 13px 15px; font-size: 13px; line-height: 1.6; margin-bottom: 20px; border: 1px solid; }
.msg.err { border-color: #B4483C; color: #8C3328; background: #FCF4F3; }
.msg.ok { border-color: var(--forest); color: var(--hunter); background: #F3F9F5; }
.msg.info { border-color: var(--grey1); color: var(--grey3); background: #fff; }

.hide { display: none; }
.note { font-size: 11px; color: var(--grey3); line-height: 1.7; margin-top: 8px; }
optgroup { font-style: normal; }

/* 저장한 기록 */
#savedWrap .chosen { border-color: var(--forest); }
#saved .line { font-size: 14px; line-height: 1.5; margin: 6px 0 8px; }
#saved .facts { font-size: 11px; color: var(--grey3); line-height: 1.7; }
#saved .memo { font-size: 11px; color: var(--grey3); line-height: 1.7; margin-top: 6px; }
.savedlink { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--hunter); }
.savedlink[aria-disabled="true"] { color: var(--grey2); pointer-events: none; }
</style>
</head>
<body>
<main class="admin">
<h1 id="head">기록 넣고 고치기</h1>
<p class="sub">AFLM</p>

<div id="msg"></div>

<!-- 1. 암호 -->
<section id="gate">
  <div class="field">
    <label for="pass">암호</label>
    <input type="password" id="pass" autocomplete="current-password" enterkeyhint="go">
  </div>
  <button id="unlock">확인</button>
  <p class="note">이 기기에 한 번만 넣으면 됩니다. 다음부터는 사이트 우하단 버튼으로 바로 들어옵니다.</p>
</section>

<section id="app" class="hide">

  <!-- 저장한 결과. 사이트가 다시 만들어지기를 기다리지 않고 여기서 바로 확인한다. -->
  <div class="field hide" id="savedWrap">
    <label>저장한 기록</label>
    <div class="chosen" id="saved"></div>
    <p class="note" id="savedState"></p>
  </div>

  <nav class="modes">
    <button type="button" id="modeNew" aria-pressed="true">새로 넣기</button>
    <button type="button" id="modeEdit" aria-pressed="false">고치기</button>
  </nav>

  <!-- 2-A. 새로 넣기: TMDB·KMDb에서 영화 찾기 -->
  <div class="field" id="findMovie">
    <label for="q">영화 제목</label>
    <div class="row">
      <input type="text" id="q" placeholder="한국어, 영어, 원어 모두 가능" enterkeyhint="search" autocomplete="off">
      <button id="go" class="ghost" style="flex:0 0 76px">찾기</button>
    </div>
    <p class="note">TMDB와 KMDb에서 함께 찾습니다. 자동으로 고르지 않으니 목록에서 직접 선택하세요.</p>
    <ul class="results" id="results"></ul>
  </div>

  <!-- 2-B. 고치기: 이미 있는 기록 찾기 -->
  <div class="field hide" id="findRecord">
    <label for="rq">기록 찾기</label>
    <div class="row">
      <input type="text" id="rq" placeholder="제목 일부" enterkeyhint="search" autocomplete="off">
      <button id="rgo" class="ghost" style="flex:0 0 76px">찾기</button>
    </div>
    <p class="note">비워 두고 찾으면 빠진 값이 있는 기록만 모아 보여줍니다.</p>
    <ul class="results" id="rresults"></ul>
  </div>

  <div class="field hide" id="chosenWrap">
    <label id="chosenLabel">선택한 영화</label>
    <div class="chosen" id="chosen"></div>
    <p class="note"><button class="ghost" id="clear" style="width:auto;padding:8px 12px;font-size:12px;margin-top:10px">다시 고르기</button></p>
  </div>

  <!-- 3. 사람이 쓰는 값 -->
  <div class="field">
    <label for="line">첫 대사</label>
    <textarea id="line" placeholder="영화의 첫 대사를 그대로" enterkeyhint="done"></textarea>
  </div>

  <div class="field">
    <label for="style">화법 분류</label>
    <select id="style"><option value="">고르세요</option></select>
  </div>

  <div class="field">
    <label for="venue">본 곳 (선택)</label>
    <select id="venue"><option value="">고르지 않음</option></select>
    <p class="note" id="venueNote">시청일은 저장한 날짜로 자동 기록됩니다.</p>
  </div>

  <div class="field">
    <label for="edition">판본 (선택)</label>
    <select id="edition">
      <option value="">기본판</option>
      <option>확장판</option>
      <option>감독판</option>
      <option>무삭제판</option>
      <option>리마스터판</option>
      <option>재개봉판</option>
    </select>
  </div>

  <div class="field">
    <label for="memo">메모 (선택)</label>
    <textarea id="memo" class="short" placeholder="대사 번역, 감상, 표기 사정 등"></textarea>
  </div>

  <button id="save" disabled>저장</button>
  <p class="note" id="saveNote"></p>
</section>
</main>

<script>
(function () {
  'use strict'

  // 암호는 이 기기에만 남는다. 서버로는 요청 머리글로만 간다.
  // sessionStorage가 아니라 localStorage를 쓰는 이유는 휴대폰에서 탭을 닫아도
  // 다시 묻지 않게 하기 위해서다. 기기를 잃었을 때는 Vercel에서 암호를 바꾸면
  // 모든 기기가 함께 끊긴다.
  var KEY = 'aflm-key'
  // 공개 페이지의 버튼이 읽는 표시. 값은 입력 화면의 상대 주소다.
  var AT = 'aflm-admin-at'

  var $ = function (id) { return document.getElementById(id) }
  var mode = 'new'              // 'new' 또는 'edit'
  var chosenMovie = null        // 새로 넣기에서 고른 TMDB·KMDb 결과
  var editing = null            // 고치기에서 고른 기록 { record, sha }
  var catalog = null            // 공개 목록 데이터 (고치기 검색용)

  function msg(text, kind) {
    $('msg').innerHTML = text
      ? '<div class="msg ' + (kind || 'info') + '">' + text + '</div>'
      : ''
  }

  function key() { return localStorage.getItem(KEY) || '' }

  /**
   * 저장해 둔 암호를 지우고 암호 칸으로 되돌린다.
   * 서버에서 암호를 바꾼 뒤에도 옛 값을 계속 들고 있으면 무엇을 눌러도
   * 막히기만 하고 이유를 알 수 없다.
   */
  function lock(reason) {
    try {
      localStorage.removeItem(KEY)
      localStorage.removeItem(AT)          // 공개 페이지의 버튼도 함께 거둔다
    } catch (e) { /* 저장소를 못 써도 화면은 되돌린다 */ }
    $('app').classList.add('hide')
    $('gate').classList.remove('hide')
    $('pass').value = ''
    if (reason) msg(reason, 'err')
    $('pass').focus()
  }

  function api(path, opts) {
    opts = opts || {}
    var withKey = opts.key || key()
    opts.headers = Object.assign({ 'x-aflm-key': withKey }, opts.headers || {})
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (b) {
        if (r.status === 401) {
          var e = new Error(b.error || '암호가 맞지 않습니다.')
          e.unauthorized = true
          throw e
        }
        if (!r.ok) throw new Error(b.error || ('오류 ' + r.status))
        return b
      })
    })
  }

  /** 어떤 요청이든 암호에서 막히면 암호 칸으로 되돌린다. */
  function fail(e) {
    if (e && e.unauthorized) lock('암호가 맞지 않습니다. 다시 넣어 주세요.')
    else msg(esc(e.message), 'err')
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  /** 목록에 없는 값이 기록에 있으면 임시 항목을 만들어 고른다. 값을 잃지 않게. */
  function selectValue(sel, value) {
    if (!value) { sel.value = ''; return }
    var has = Array.prototype.some.call(sel.options, function (o) { return o.value === value })
    if (!has) {
      var o = document.createElement('option')
      o.value = value
      o.textContent = value + ' (목록에 없음)'
      sel.appendChild(o)
    }
    sel.value = value
  }

  // ── 분류 목록 채우기 ────────────────────────────────────────────────
  fetch('style-groups.json').then(function (r) { return r.json() }).then(function (g) {
    var sel = $('style')
    g.groups.forEach(function (grp) {
      var og = document.createElement('optgroup')
      og.label = grp.name
      grp.styles.forEach(function (s) {
        var o = document.createElement('option')
        o.value = s
        o.textContent = s
        o.dataset.group = grp.key
        og.appendChild(o)
      })
      sel.appendChild(og)
    })
  }).catch(function () {
    msg('분류 목록을 읽지 못했습니다. style-groups.json을 확인하세요.', 'err')
  })

  // ── 시청 경로 목록 채우기 ───────────────────────────────────────────
  fetch('venues.json').then(function (r) { return r.json() }).then(function (v) {
    var sel = $('venue')
    v.kinds.forEach(function (k) {
      var og = document.createElement('optgroup')
      og.label = k.label
      k.names.forEach(function (n) {
        var o = document.createElement('option')
        o.value = n
        o.textContent = n
        o.dataset.kind = k.key
        og.appendChild(o)
      })
      sel.appendChild(og)
    })
  }).catch(function () { /* 목록이 없어도 저장은 된다 */ })

  // ── 암호 ────────────────────────────────────────────────────────────
  function opened() {
    $('gate').classList.add('hide')
    $('app').classList.remove('hide')
    // 공개 페이지가 버튼을 그릴 수 있도록 이 화면의 주소를 남긴다.
    try {
      var here = location.pathname.replace(/^.*\//, '') || 'admin.html'
      localStorage.setItem(AT, here)
    } catch (e) { /* 저장을 못 해도 이 화면은 그대로 쓴다 */ }
    setMode('new')
  }

  // 암호는 서버에 물어 확인한 뒤에만 저장한다. 틀린 값을 들고 다음 화면으로
  // 넘어가면 무엇을 눌러도 막히기만 해서 어디가 잘못됐는지 알기 어렵다.
  function unlock() {
    var v = $('pass').value.trim()
    if (!v) return
    $('unlock').disabled = true
    msg('확인하는 중', 'info')
    api('/api/auth', { key: v }).then(function () {
      localStorage.setItem(KEY, v)
      msg('')
      opened()
      $('q').focus()
    }).catch(function (e) {
      msg(e.unauthorized ? '암호가 맞지 않습니다.' : esc(e.message), 'err')
      $('pass').select()
    }).then(function () { $('unlock').disabled = false })
  }
  $('unlock').addEventListener('click', unlock)
  $('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock() })

  // 이미 저장된 암호도 한 번 확인한다. 서버에서 암호를 바꿨다면 여기서 걸린다.
  if (key()) {
    opened()
    api('/api/auth').catch(function (e) {
      if (e.unauthorized) lock('암호가 바뀌었습니다. 새 암호를 넣어 주세요.')
    })
  }

  // ── 모드 전환 ───────────────────────────────────────────────────────
  function setMode(next) {
    mode = next
    var isNew = next === 'new'
    $('modeNew').setAttribute('aria-pressed', String(isNew))
    $('modeEdit').setAttribute('aria-pressed', String(!isNew))
    $('head').textContent = isNew ? '기록 넣기' : '기록 고치기'
    $('findMovie').classList.toggle('hide', !isNew)
    $('findRecord').classList.toggle('hide', isNew)
    $('chosenLabel').textContent = isNew ? '선택한 영화' : '고치는 기록'
    $('venueNote').textContent = isNew
      ? '시청일은 저장한 날짜로 자동 기록됩니다.'
      : '비어 있던 값을 지금 채울 수 있습니다.'
    $('saveNote').textContent = isNew
      ? '저장하면 기록이 하나 늘고 사이트가 다시 만들어집니다.'
      : '보낸 값만 바뀝니다. 손대지 않은 값은 그대로 둡니다.'
    $('save').textContent = isNew ? '저장' : '고치기'
    resetForm()
  }

  function resetForm() {
    chosenMovie = null
    editing = null
    $('chosenWrap').classList.add('hide')
    $('results').innerHTML = ''
    $('rresults').innerHTML = ''
    $('q').value = ''
    $('rq').value = ''
    $('line').value = ''
    $('style').value = ''
    $('venue').value = ''
    $('edition').value = ''
    $('memo').value = ''
    check()
  }

  $('modeNew').addEventListener('click', function () { msg(''); hideSaved(); setMode('new') })
  $('modeEdit').addEventListener('click', function () { msg(''); hideSaved(); setMode('edit') })

  // ── 새로 넣기: 영화 찾기 ────────────────────────────────────────────
  function search() {
    var q = $('q').value.trim()
    if (!q) return
    msg('찾는 중', 'info')
    $('results').innerHTML = ''
    api('/api/search?q=' + encodeURIComponent(q)).then(function (d) {
      if (d.notes && d.notes.length) msg(d.notes.map(esc).join('<br>'), 'info')
      else msg('')
      if (!d.results.length) { msg('결과가 없습니다. 다른 표기로 찾아보세요.', 'info'); return }
      $('results').innerHTML = d.results.map(function (r, i) {
        var img = r.poster
          ? '<img src="' + esc(r.poster) + '" alt="" loading="lazy">'
          : '<span class="noimg">없음</span>'
        var bits = [r.year, r.title_original !== r.title ? r.title_original : null]
          .filter(Boolean).map(esc).join(' · ')
        return '<li><button type="button" data-i="' + i + '">' + img +
          '<span><span class="t">' + esc(r.title || '(제목 없음)') + '</span>' +
          '<span class="d">' + bits + ' <span class="src">' + esc(r.source) + '</span></span></span></button></li>'
      }).join('')
      $('results').querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { choose(d.results[+b.dataset.i]) })
      })
    }).catch(fail)
  }
  $('go').addEventListener('click', search)
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); search() } })

  function choose(r) {
    msg('정보를 가져오는 중', 'info')
    var done = function (meta) {
      chosenMovie = meta
      render(meta)
      msg('')
      $('line').focus()
    }
    if (r.source === 'tmdb') {
      api('/api/detail?source=tmdb&id=' + encodeURIComponent(r.id))
        .then(function (d) {
          done({
            title: d.title_original || d.title,
            title_original: d.title_original, title_ko: d.title_ko, title_local: d.title_local,
            year: d.year, release_date: d.release_date, genre: d.genre,
            director: d.director, director_ko: d.director_ko, country: d.country,
            poster_url: d.poster_url,
            tmdb_id: d.tmdb_id, kmdb_id: null, source: 'tmdb'
          })
        })
        .catch(fail)
    } else {
      done({
        title: r.title_original || r.title,
        title_original: r.title_original, title_ko: r.title, title_local: null,
        year: r.year, release_date: r.release_date, genre: r.genre,
        director: r.director, director_ko: null, country: r.country, poster_url: r.poster,
        tmdb_id: null, kmdb_id: r.id, source: 'kmdb'
      })
    }
  }

  function row(label, value) {
    return value
      ? '<dt>' + esc(label) + '</dt><dd>' + esc(Array.isArray(value) ? value.join(', ') : value) + '</dd>'
      : '<dt>' + esc(label) + '</dt><dd class="unknown">' + esc(label) + ' 확인되지 않음</dd>'
  }

  function render(m) {
    var img = m.poster_url
      ? '<img src="' + esc(m.poster_url) + '" alt="">'
      : '<span class="noimg">포스터<br>없음</span>'
    $('chosen').innerHTML = img + '<dl>' +
      '<dd class="name">' + esc(m.title) + '</dd>' +
      (m.title_ko ? '<dd>' + esc(m.title_ko) + '</dd>' : '') +
      row('개봉', m.year) + row('감독', m.director) + row('장르', m.genre) +
      '</dl>'
    $('chosenWrap').classList.remove('hide')
    $('results').innerHTML = ''
    check()
  }

  $('clear').addEventListener('click', function () {
    chosenMovie = null
    editing = null
    $('chosenWrap').classList.add('hide')
    if (mode === 'new') { $('q').value = ''; $('q').focus() }
    else { $('rq').value = ''; $('rq').focus() }
    check()
  })

  // ── 고치기: 이미 있는 기록 찾기 ─────────────────────────────────────
  // 목록은 사이트가 이미 내보내는 공개 데이터를 그대로 쓴다. 검색만 하려고
  // 서버 함수를 하나 더 두지 않는다. 고칠 기록을 고른 뒤에 원본을 받아온다.
  function loadCatalog() {
    if (catalog) return Promise.resolve(catalog)
    return fetch('data/movies.json', { cache: 'no-store' })
      .then(function (r) { return r.json() })
      .then(function (d) { catalog = d.items || []; return catalog })
  }

  /** 빠진 값. 무엇을 채워야 하는지 목록에서 바로 보이게 한다. */
  function gapsOf(it) {
    var g = []
    if (!it.line) g.push('첫 대사')
    if (!it.style) g.push('화법')
    return g
  }

  function searchRecords() {
    var q = $('rq').value.trim().toLowerCase()
    msg('찾는 중', 'info')
    loadCatalog().then(function (items) {
      var hits = q
        ? items.filter(function (it) {
            return String(it.title || '').toLowerCase().indexOf(q) >= 0 ||
                   String(it.line || '').toLowerCase().indexOf(q) >= 0 ||
                   String(it.id || '').indexOf(q) >= 0
          })
        : items.filter(function (it) { return gapsOf(it).length > 0 })

      if (!hits.length) {
        msg(q ? '그 제목으로 찾은 기록이 없습니다.' : '빠진 값이 있는 기록이 없습니다.', 'info')
        $('rresults').innerHTML = ''
        return
      }
      msg('')
      $('rresults').innerHTML = hits.slice(0, 40).map(function (it, i) {
        var img = it.poster
          ? '<img src="' + esc(it.poster) + '" alt="" loading="lazy">'
          : '<span class="noimg">없음</span>'
        var gaps = gapsOf(it)
        var bits = [it.year, it.style].filter(Boolean).map(esc).join(' · ')
        return '<li><button type="button" data-i="' + i + '">' + img +
          '<span><span class="t">' + esc(it.title || '(제목 없음)') + '</span>' +
          '<span class="d">' + bits +
          (gaps.length ? ' <span class="gap">' + esc(gaps.join(', ')) + ' 없음</span>' : '') +
          '</span></span></button></li>'
      }).join('')
      if (hits.length > 40) {
        msg(hits.length + '건 가운데 40건만 보여줍니다. 제목을 더 넣어 좁히세요.', 'info')
      }
      $('rresults').querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { openRecord(hits[+b.dataset.i].id) })
      })
    }).catch(fail)
  }
  $('rgo').addEventListener('click', searchRecords)
  $('rq').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); searchRecords() } })

  function openRecord(id) {
    msg('기록을 가져오는 중', 'info')
    api('/api/record?id=' + encodeURIComponent(id)).then(function (d) {
      editing = d
      var m = d.record
      var img = m.poster_url
        ? '<img src="' + esc(m.poster_url) + '" alt="">'
        : '<span class="noimg">포스터<br>없음</span>'
      $('chosen').innerHTML = img + '<dl>' +
        '<dd class="name">' + esc(m.title) + '</dd>' +
        (m.title_ko ? '<dd>' + esc(m.title_ko) + '</dd>' : '') +
        row('개봉', m.released) + row('감독', m.director) + row('주소', m.id) +
        '</dl>'
      $('chosenWrap').classList.remove('hide')
      $('rresults').innerHTML = ''

      $('line').value = m.first_line || ''
      selectValue($('style'), m.style || '')
      selectValue($('venue'), m.watched_via && m.watched_via.name ? m.watched_via.name : '')
      selectValue($('edition'), m.edition || '')
      $('memo').value = m.note || ''
      msg('')
      check()
    }).catch(fail)
  }

  // ── 저장한 기록 보여주기 ────────────────────────────────────────────
  // 사이트는 다시 만들어지기까지 시간이 걸린다. 그동안 무엇이 저장됐는지
  // 확인할 방법이 없으면 제대로 들어갔는지 알 수 없다. 저장한 값을 그 자리에
  // 그대로 보여주고, 사이트에 나타나면 링크를 연다.
  var watchTimer = null
  var builtBefore = null        // 저장 직전에 사이트가 만들어져 있던 시각

  /** 공개 목록 데이터를 캐시 없이 받는다. */
  function fetchCatalogFile() {
    return fetch('data/movies.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json() })
  }

  /**
   * 저장을 보내기 직전의 빌드 시각을 적어 둔다.
   * 이 값이 달라지면 사이트가 다시 만들어진 것이다. 메모나 본 곳처럼 공개
   * 목록에 담기지 않는 값을 고쳤을 때도 이것으로 알 수 있다.
   */
  function markBuildBefore() {
    builtBefore = null
    return fetchCatalogFile()
      .then(function (d) { builtBefore = d.built_at || null })
      .catch(function () { builtBefore = null })
  }

  function showSaved(snap) {
    if (watchTimer) { clearTimeout(watchTimer); watchTimer = null }

    var img = snap.poster
      ? '<img src="' + esc(snap.poster) + '" alt="">'
      : '<span class="noimg">포스터<br>없음</span>'
    var facts = [snap.year, snap.style, snap.venue, snap.edition]
      .filter(Boolean).map(esc).join(' · ')

    $('saved').innerHTML = img + '<div>' +
      '<div class="name">' + esc(snap.title) + '</div>' +
      '<p class="line">' + esc(snap.line) + '</p>' +
      '<div class="facts">' + facts + '</div>' +
      (snap.memo ? '<div class="memo">' + esc(snap.memo) + '</div>' : '') +
      '<a class="savedlink" id="savedLink" aria-disabled="true" href="movie/' +
        encodeURIComponent(snap.id) + '.html">사이트에서 보기</a>' +
      '</div>'
    $('savedState').textContent = '사이트에 반영되는 중입니다. 이 화면의 내용이 저장된 값입니다.'
    $('savedWrap').classList.remove('hide')
    watchLive(snap, 0)
  }

  /**
   * 사이트가 다시 만들어졌는지 지켜본다.
   *
   * 판정 기준은 빌드 시각이 저장 직전과 달라졌는가이다. 기록이 목록에
   * 나타났는지만 보면, 메모나 본 곳처럼 공개 목록에 담기지 않는 값을 고쳤을 때
   * 아무것도 달라지지 않아 곧바로 '반영됐다'고 잘못 말하게 된다.
   *
   * 저장 자체는 이미 끝났다. 확인이 안 되면 확인하지 못했다고만 적는다.
   * 됐다고 하지 않는다.
   */
  function watchLive(snap, tries) {
    fetchCatalogFile()
      .then(function (d) {
        var rebuilt = builtBefore === null
          ? false                                  // 견줄 값이 없으면 판정하지 않는다
          : (d.built_at || null) !== builtBefore

        var listed = false
        var items = d.items || []
        for (var i = 0; i < items.length; i++) {
          if (items[i].id === snap.id) {
            listed = items[i].line === snap.line && items[i].style === snap.style
            break
          }
        }

        if (rebuilt && listed) {
          var a = $('savedLink')
          if (a) a.setAttribute('aria-disabled', 'false')
          $('savedState').textContent = '사이트에 반영됐습니다.'
          return
        }
        if (tries < 45) {                          // 4초 간격, 3분까지 지켜본다
          watchTimer = setTimeout(function () { watchLive(snap, tries + 1) }, 4000)
        } else {
          $('savedState').textContent =
            '저장은 끝났지만 사이트에 나타난 것을 아직 확인하지 못했습니다. 잠시 뒤 사이트를 새로 고쳐 보세요.'
        }
      })
      .catch(function () {
        if (tries < 45) {
          watchTimer = setTimeout(function () { watchLive(snap, tries + 1) }, 4000)
        }
      })
  }

  function hideSaved() {
    if (watchTimer) { clearTimeout(watchTimer); watchTimer = null }
    $('savedWrap').classList.add('hide')
  }

  // ── 저장 ────────────────────────────────────────────────────────────
  function check() {
    var filled = $('line').value.trim() && $('style').value
    $('save').disabled = mode === 'new'
      ? !(chosenMovie && filled)
      : !(editing && filled)
  }
  $('line').addEventListener('input', check)
  $('style').addEventListener('change', check)

  /** 폼에 든 사람 손 값. 두 모드가 같은 모양으로 보낸다. */
  function humanFields() {
    var opt = $('style').selectedOptions[0]
    var venueOpt = $('venue').selectedOptions[0]
    var name = $('venue').value
    var kind = venueOpt ? (venueOpt.dataset.kind || null) : null

    // venues.json에 없는 이름은 임시 항목이라 종류를 모른다. 고치는 기록에
    // 이미 종류가 적혀 있고 이름을 바꾸지 않았다면 그 값을 지킨다.
    var was = editing && editing.record ? editing.record.watched_via : null
    if (!kind && was && was.name === name) kind = was.kind || null

    return {
      first_line: $('line').value.trim(),
      style: $('style').value,
      style_group: opt ? (opt.dataset.group || null) : null,
      watched_via: name ? { kind: kind, name: name } : null,
      edition: $('edition').value || null,
      note: $('memo').value.trim() || null
    }
  }

  /** 화면에 보여줄 저장 결과. 서버에 보낸 값과 고른 영화에서 만든다. */
  function snapshotOf(id, body, meta) {
    return {
      id: id,
      title: meta.title,
      year: meta.year || null,
      poster: meta.poster_url || null,
      line: body.first_line,
      style: body.style,
      venue: body.watched_via ? body.watched_via.name : null,
      edition: body.edition,
      memo: body.note
    }
  }

  function saveNew() {
    var body = humanFields()
    body.title = chosenMovie.title
    body.meta = chosenMovie
    return api('/api/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (d) {
      msg('저장되었습니다. 지금 ' + d.total + '편.', 'ok')
      var snap = snapshotOf(d.id, body, chosenMovie)
      resetForm()
      catalog = null                 // 고치기 검색이 새 기록을 보도록 다시 받게 한다
      showSaved(snap)
    })
  }

  function saveEdit() {
    var body = humanFields()
    var was = editing.record
    body.id = was.id
    body.sha = editing.sha
    return api('/api/update', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (d) {
      if (!d.changed) {
        msg('바뀐 값이 없어 그대로 두었습니다.', 'info')
        return
      }
      msg('저장되었습니다.', 'ok')
      var snap = snapshotOf(was.id, body, {
        title: was.title, year: was.released, poster_url: was.poster_url
      })
      resetForm()
      catalog = null
      showSaved(snap)
    })
  }

  $('save').addEventListener('click', function () {
    if (mode === 'new' && !chosenMovie) return
    if (mode === 'edit' && !editing) return
    $('save').disabled = true
    msg(mode === 'new' ? '저장하는 중' : '고치는 중', 'info')
    // 보내기 전에 지금 사이트가 만들어져 있는 시각을 적어 둔다. 저장한 뒤
    // 이 값이 달라지는 것으로 다시 만들어졌는지 가려낸다.
    var work = markBuildBefore().then(function () {
      return mode === 'new' ? saveNew() : saveEdit()
    })
    work.catch(fail).then(check)
  })
})()
</script>
</body>
</html>
